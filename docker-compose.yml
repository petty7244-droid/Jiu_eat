services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: jiu_eat_mssql
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: developer
      MSSQL_SA_PASSWORD: "${MSSQL_SA_PASSWORD:-Aa123456}"
    ports:
      - "1433:1433"
    volumes:
      - mssql_data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1' >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: jiu_eat_backend
    environment:
      MSSQL_SERVER: db
      MSSQL_PORT: "1433"
      MSSQL_DATABASE: jiu_eat_1.2
      MSSQL_USER: sa
      MSSQL_SA_PASSWORD: "${MSSQL_SA_PASSWORD:-Aa123456}"
      MSSQL_DRIVER: "ODBC Driver 18 for SQL Server"
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  mssql_data: